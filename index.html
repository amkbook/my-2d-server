<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D Live Market App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 10px; padding-bottom: 80px; overflow-x: hidden; }
    .container { width: 100%; max-width: 450px; display: flex; flex-direction: column; gap: 15px; }
    
    .tab-content { display: none; }
    .tab-content.active { display: flex; flex-direction: column; gap: 15px; }

    .card { background: #1e293b; border-radius: 16px; padding: 20px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.3); border: 1px solid #334155; }
    .notice { background: #0284c7; color: white; padding: 10px; border-radius: 8px; font-size: 14px; text-align: center; }
    
    .live-title-container { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 5px; }
    .live-title { font-size: 16px; color: #94a3b8; }
    
    /* ဈေးကွက် အခြေအနေပြ အညွှန်းသင်္ကေတများ */
    .status-indicator { display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: bold; }
    .status-live { color: #ef4444; display: inline-flex; align-items: center; gap: 4px; }
    .status-paused { color: #f59e0b; display: inline-flex; align-items: center; gap: 4px; }
    .spinner { width: 10px; height: 10px; border: 2px solid #ef4444; border-top: 2px solid transparent; border-radius: 50%; animation: spin 1s linear infinite; display: inline-block; }
    .status-closed { color: #10b981; }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .live-2d { font-size: 72px; font-weight: bold; color: #f59e0b; text-shadow: 0 0 15px rgba(245, 158, 11, 0.4); margin: 10px 0; }
    .time-badge { background: #334155; color: #38bdf8; padding: 4px 12px; border-radius: 20px; font-size: 12px; display: inline-block; }
    
    .set-info { display: flex; justify-content: space-between; margin-top: 15px; padding-top: 15px; border-top: 1px solid #334155; }
    .set-box { text-align: center; flex: 1; }
    .set-label { font-size: 12px; color: #94a3b8; }
    .set-value { font-size: 16px; font-weight: bold; color: #e2e8f0; margin-top: 2px; }

    /* 2D ထွက်ပေါ်ရာ ပင်မရင်းမြစ်ဂဏန်းများကို အပြာရောင်တောက်တောက်ပပ ပြသရန် */
    .source-digit {
      color: #38bdf8 !important;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.8), 0 0 20px rgba(56, 189, 248, 0.5);
      font-weight: 900;
    }

    .audio-btn { background: #10b981; color: white; border: none; padding: 10px; border-radius: 8px; width: 100%; font-weight: bold; margin-top: 10px; cursor: pointer; }
    
    /* ဇယားကွက်အသစ် ဒီဇိုင်း (Modern, Internet, TW များနှင့် အတန်းရှည်/အတို ပုံစံ) */
    .schedule-table-container { background: #1e293b; border-radius: 12px; padding: 12px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .table-header-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; text-align: center; font-size: 13px; font-weight: bold; color: #38bdf8; padding-bottom: 6px; border-bottom: 1px solid #334155; }
    
    .table-row-group { display: flex; flex-direction: column; gap: 8px; }
    .market-row-item { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; background: #0f172a; border-radius: 8px; padding: 10px 8px; align-items: center; text-align: center; border: 1px solid #334155; }
    .row-time-label { font-size: 13px; font-weight: bold; color: #facc15; text-align: left; padding-left: 6px; }
    .row-val { font-size: 18px; font-weight: bold; color: #facc15; }

    .chat-box { background: #1e293b; border-radius: 16px; padding: 15px; border: 1px solid #334155; display: flex; flex-direction: column; height: 260px; }
    .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; padding-right: 5px; }
    .msg { background: #334155; padding: 8px 12px; border-radius: 8px; font-size: 13px; }
    .msg-user { color: #38bdf8; font-weight: bold; margin-right: 5px; }
    .chat-input-row { display: flex; gap: 8px; }
    .chat-input-row input { flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: white; padding: 8px 12px; outline: none; }
    .chat-input-row button { background: #3b82f6; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #1e293b; border-top: 1px solid #334155; display: flex; justify-content: space-around; padding: 10px 0; max-width: 450px; margin: 0 auto; z-index: 100; }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: #94a3b8; font-size: 11px; cursor: pointer; text-decoration: none; border: none; background: none; flex: 1; }
    .nav-item.active { color: #38bdf8; font-weight: bold; }
    .nav-icon { font-size: 18px; margin-bottom: 2px; }

    /* ငွေစက္ကူ ဝဲပျံကျသည့် Animation စတိုင်လ်များ */
    .falling-money {
      position: fixed;
      top: -60px;
      width: 55px;
      height: auto;
      z-index: 9999;
      pointer-events: none;
      animation: fallDown 4s linear infinite;
    }
    @keyframes fallDown {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(105vh) rotate(360deg); opacity: 0.85; }
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- PAGE 1: Home (2D Live) -->
    <div id="page-home" class="tab-content active">
      <div id="notice" class="notice">2D Live မှ ကြိုဆိုပါသည်။</div>

      <div class="card">
        <div class="live-title-container">
          <div class="live-title">LIVE 2D RESULT</div>
          <div id="marketStatus" class="status-indicator status-live">
            <span class="spinner"></span> <span>Live</span>
          </div>
        </div>

        <div id="live2D" class="live-2d">--</div>
        <div id="updateTime" class="time-badge">Updating...</div>

        <div class="set-info">
          <div class="set-box">
            <div class="set-label">SET Index</div>
            <div id="setIndex" class="set-value">----.--</div>
          </div>
          <div class="set-box">
            <div class="set-label">Value</div>
            <div id="setValue" class="set-value">----.--</div>
          </div>
        </div>

        <button id="audio-btn" class="audio-btn" onclick="toggleSound()">🔊 အသံဖွင့်ထားသည်</button>
      </div>

      <!-- ပုံစံအသစ် ဇယားကွက် (Modern, Internet, TW နှင့် အတန်းရှည်/အတို များ) -->
      <div class="schedule-table-container">
        <div class="table-header-row">
          <div></div>
          <div>Modern</div>
          <div>Internet</div>
          <div>TW</div>
        </div>
        
        <div class="table-row-group">
          <!-- ပထမအတန်းရှည် (09:30 AM) -->
          <div class="market-row-item">
            <div class="row-time-label">09:30 AM</div>
            <div id="t0930_modern" class="row-val">--</div>
            <div id="t0930_internet" class="row-val">--</div>
            <div id="t0930_tw" class="row-val">--</div>
          </div>
          
          <!-- ညာဘက်အကွက်သေး (12:01 PM) -->
          <div class="market-row-item">
            <div class="row-time-label">12:01 PM</div>
            <div id="t1201_modern" class="row-val" style="grid-column: span 3;">--</div>
          </div>

          <!-- ဒုတိယအတန်းရှည် (02:00 PM) -->
          <div class="market-row-item">
            <div class="row-time-label">02:00 PM</div>
            <div id="t1400_modern" class="row-val">--</div>
            <div id="t1400_internet" class="row-val">--</div>
            <div id="t1400_tw" class="row-val">--</div>
          </div>

          <!-- ညာဘက်အကွက်သေး (04:30 PM) -->
          <div class="market-row-item">
            <div class="row-time-label">04:30 PM</div>
            <div id="t1630_modern" class="row-val" style="grid-column: span 3;">--</div>
          </div>
        </div>
      </div>

      <div class="chat-box">
        <div class="live-title" style="margin-bottom: 5px;">Live Chatbox</div>
        <div id="chatMessages" class="chat-messages"></div>
        <div class="chat-input-row">
          <input type="text" id="chatInput" placeholder="စကားပြောရန် စာရိုက်ပါ..." onkeypress="handleKeyPress(event)">
          <button onclick="sendMessage()">ပို့မည်</button>
        </div>
      </div>
    </div>

    <!-- PAGE 2: Gold Price -->
    <div id="page-gold" class="tab-content">
      <div class="card"><h2>🪙 ရွှေဈေးနှုန်းများ</h2></div>
    </div>

    <!-- PAGE 3: 2D History -->
    <div id="page-2d-history" class="tab-content">
      <div class="card"><h2>📅 2D နေ့စဉ်မှတ်တမ်း</h2></div>
    </div>

    <!-- PAGE 4: 3D History -->
    <div id="page-3d-history" class="tab-content">
      <div class="card"><h2>🎯 3D နေ့စဉ်မှတ်တမ်း</h2></div>
    </div>

    <!-- PAGE 5: More -->
    <div id="page-more" class="tab-content">
      <div class="card"><h2>⚙ More & နေ့စဉ်ဓာတ်ပုံများ</h2></div>
    </div>

  </div>

  <div class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('page-home', this)"><span class="nav-icon">🏠</span><span>Home</span></button>
    <button class="nav-item" onclick="switchTab('page-gold', this)"><span class="nav-icon">🪙</span><span>ရွှေဈေး</span></button>
    <button class="nav-item" onclick="switchTab('page-2d-history', this)"><span class="nav-icon">📅</span><span>2D မှတ်တမ်း</span></button>
    <button class="nav-item" onclick="switchTab('page-3d-history', this)"><span class="nav-icon">🎯</span><span>3D မှတ်တမ်း</span></button>
    <button class="nav-item" onclick="switchTab('page-more', this)"><span class="nav-icon">⚙</span><span>More</span></button>
  </div>

  <script>
    let current2D = "--";
    let announcedTimes = {};
    let soundEnabled = true;
    let isLiveActive = false;

    let lastSavedData = JSON.parse(localStorage.getItem('last_market_data')) || {
      setIndex: "----.--",
      value: "----.--",
      live2D: "--",
      time: "Market Closed",
      notice: "ဈေးကွက်ပိတ်ချိန် ဖြစ်ပါသည်။"
    };

    function renderSavedData(data) {
      if (data.setIndex && data.setIndex !== "----.--") {
        document.getElementById('setIndex').innerHTML = formatSourceHighlight(data.setIndex, 'index');
      }
      if (data.value && data.value !== "----.--") {
        document.getElementById('setValue').innerHTML = formatSourceHighlight(data.value, 'value');
      }
      if (data.live2D && data.live2D !== "--") {
        document.getElementById('live2D').innerText = data.live2D;
      }
      if (data.notice) {
        document.getElementById('notice').innerText = data.notice;
      }
    }

    renderSavedData(lastSavedData);

    function switchTab(pageId, btn) {
      document.querySelectorAll('.tab-content').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
      btn.classList.add('active');
    }

    function speak2D() {
      if (current2D !== "--" && current2D.length === 2) {
        if (!soundEnabled) return;
        let d1 = current2D[0];
        let d2 = current2D[1];

        let audio1 = new Audio(`./sounds/${d1}.mp3`);
        let audio2 = new Audio(`./sounds/${d2}.mp3`);

        audio1.play().catch(e => console.log(e));
        audio1.onended = function() {
          audio2.play().catch(e => console.log(e));
        };
      }
    }

    function playAnnouncement(filename) {
      if (!soundEnabled) return;
      let audio = new Audio(`./sounds/${filename}.mp3`);
      audio.play().catch(e => console.log(e));
    }

    const moneyImages = [
      './images/Myanmar-5-26-sm-removebg-preview.png',
      './images/myanmar-money-10000-kyats-high-260nw-2445695....png'
    ];

    function startMoneyRain() {
      if (window.isMoneyRainActive) return;
      window.isMoneyRainActive = true;

      const rainInterval = setInterval(() => {
        const img = document.createElement('img');
        const randomImg = moneyImages[Math.floor(Math.random() * moneyImages.length)];
        img.src = randomImg;
        img.classList.add('falling-money');
        img.style.left = Math.random() * window.innerWidth + 'px';
        document.body.appendChild(img);

        setTimeout(() => {
          img.remove();
        }, 4000);
      }, 250);

      setTimeout(() => {
        clearInterval(rainInterval);
        window.isMoneyRainActive = false;
      }, 15000);
    }

    function updateMarketUI(status) {
      const statusEl = document.getElementById('marketStatus');
      if (status === 'live') {
        statusEl.className = 'status-indicator status-live';
        statusEl.innerHTML = '<span class="spinner"></span> <span>Live</span>';
      } else if (status === 'paused') {
        statusEl.className = 'status-indicator status-paused';
        statusEl.innerHTML = '<span>⏸ Live Paused</span>';
      } else {
        statusEl.className = 'status-indicator status-closed';
        statusEl.innerHTML = '<span>✔ ဈေးကွက်ပိတ်သည်</span>';
      }
    }

    function checkMarketSchedule() {
      const now = new Date();
      const day = now.getDay();
      
      if (day === 0 || day === 6) {
        isLiveActive = false;
        updateMarketUI('closed');
        document.getElementById('notice').innerText = "စနေ/တနင်္ဂနွေ ပိတ်ရက် ဖြစ်ပါသည်။";
        return;
      }

      const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
      const myanmarTime = new Date(utc + (3600000 * 6.5));
      
      const hours = myanmarTime.getHours();
      const minutes = myanmarTime.getMinutes();
      const totalMinutes = hours * 60 + minutes;

      const morningStart = 9 * 60;      // 9:00 AM
      const morningEnd = 12 * 60 + 1;    // 12:01 PM
      const afternoonStart = 14 * 60;    // 2:00 PM
      const afternoonEnd = 16 * 60 + 30; // 4:30 PM

      let inMorningLive = (totalMinutes >= morningStart && totalMinutes <= morningEnd);
      let inAfternoonLive = (totalMinutes >= afternoonStart && totalMinutes <= afternoonEnd);

      if (inMorningLive || inAfternoonLive) {
        isLiveActive = true;
        updateMarketUI('live');

        if (hours === 11 && minutes === 45 && !announcedTimes['m1145']) {
          announcedTimes['m1145'] = true;
          playAnnouncement('min15');
        }
        if (hours === 11 && minutes === 58 && !announcedTimes['m1158']) {
          announcedTimes['m1158'] = true;
          playAnnouncement('min3');
        }

        if (hours === 12 && minutes === 1) {
          if (!announcedTimes['m1201']) {
            announcedTimes['m1201'] = true;
            startMoneyRain();
            let currentVal = document.getElementById('live2D').innerText;
            if (currentVal !== "--") {
              document.getElementById('t1201_modern').innerText = currentVal;
            }
          }
        }

        if (hours === 15 && minutes === 15 && !announcedTimes['e1515']) {
          announcedTimes['e1515'] = true;
          playAnnouncement('min15');
        }
        if (hours === 15 && minutes === 27 && !announcedTimes['e1527']) {
          announcedTimes['e1527'] = true;
          playAnnouncement('min3');
        }

        if (hours === 16 && minutes === 30) {
          if (!announcedTimes['e1630']) {
            announcedTimes['e1630'] = true;
            startMoneyRain();
            let currentVal = document.getElementById('live2D').innerText;
            if (currentVal !== "--") {
              document.getElementById('t1630_modern').innerText = currentVal;
            }
          }
        }

      } else {
        isLiveActive = false;
        updateMarketUI('paused');
      }

      if (hours === 9 && minutes === 0 && !announcedTimes['reset_0900']) {
        announcedTimes = { 'reset_0900': true };
        document.getElementById('t0930_modern').innerText = "--";
        document.getElementById('t0930_internet').innerText = "--";
        document.getElementById('t0930_tw').innerText = "--";
        document.getElementById('t1201_modern').innerText = "--";
        document.getElementById('t1400_modern').innerText = "--";
        document.getElementById('t1400_internet').innerText = "--";
        document.getElementById('t1400_tw').innerText = "--";
        document.getElementById('t1630_modern').innerText = "--";
      } else if (hours !== 9) {
        announcedTimes['reset_0900'] = false;
      }
    }

    function formatSourceHighlight(rawText, type) {
      if (!rawText) return rawText;
      let textStr = String(rawText).trim();
      let cleanText = textStr.replace(/,/g, '');
      if (!cleanText.includes('.')) return textStr;

      let parts = cleanText.split('.');
      let intPart = parts[0];
      let decPart = parts[1];

      if (type === 'index') {
        if (decPart && decPart.length > 0) {
          let lastDigit = decPart.slice(-1);
          let restDec = decPart.slice(0, -1);
          return `${intPart}.${restDec}<span class="source-digit">${lastDigit}</span>`;
        }
      } else if (type === 'value') {
        if (intPart && intPart.length > 0) {
          let lastIntDigit = intPart.slice(-1);
          let restInt = intPart.slice(0, -1);
          return `${restInt}<span class="source-digit">${lastIntDigit}</span>.${decPart}`;
        }
      }
      return textStr;
    }

    // ဆာဗာမှ Live ဒေတာနှင့် Admin ဇယားကွက် ဒေတာများကိုပါ တစ်ပါတည်း လှမ်းဆွဲခြင်း
    async function fetchLiveData() {
      try {
        const res = await fetch('/api/live');
        const data = await res.json();
        
        if(data.success) {
          // Live ပင်မမျက်နှာပြင် ဒေတာများ update လုပ်ရန်
          if (data.live2D && data.live2D !== "--") {
            localStorage.setItem('last_market_data', JSON.stringify(data));
            
            document.getElementById('setIndex').innerHTML = formatSourceHighlight(data.setIndex, 'index');
            document.getElementById('setValue').innerHTML = formatSourceHighlight(data.value, 'value');
            
            document.getElementById('live2D').innerText = data.live2D;
            document.getElementById('updateTime').innerText = "Last Update: " + data.time;
            document.getElementById('notice').innerText = data.notice;

            if(current2D !== data.live2D) {
              current2D = data.live2D;
              speak2D();
            }
          }

          // Admin Control Panel မှ သိမ်းဆည်းထားသော 09:30 AM နှင့် 02:00 PM ဇယားကွက် အချက်အလက်များကို ထည့်သွင်းခြင်း
          if (data.schedule) {
            // 09:30 AM
            if(data.schedule.t0930) {
              document.getElementById('t0930_modern').innerText = data.schedule.t0930.modern || "--";
              document.getElementById('t0930_internet').innerText = data.schedule.t0930.internet || "--";
              document.getElementById('t0930_tw').innerText = data.schedule.t0930.tw || "--";
            }
            // 02:00 PM
            if(data.schedule.t1400) {
              document.getElementById('t1400_modern').innerText = data.schedule.t1400.modern || "--";
              document.getElementById('t1400_internet').innerText = data.schedule.t1400.internet || "--";
              document.getElementById('t1400_tw').innerText = data.schedule.t1400.tw || "--";
            }
          }
        }
      } catch(e) {}
    }

    async function fetchChat() {
      try {
        const res = await fetch('/api/chat');
        const data = await res.json();
        if(data.success) {
          const chatDiv = document.getElementById('chatMessages');
          chatDiv.innerHTML = data.messages.map(m => 
            `<div class="msg"><span class="msg-user">${m.user}:</span> ${m.text}</div>`
          ).join('');
          chatDiv.scrollTop = chatDiv.scrollHeight;
        }
      } catch(e) {}
    }

    async function sendMessage() {
      const int = document.getElementById('chatInput');
      const text = int.value.trim();
      if(!text) return;

      await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user: "User", text: text })
      });

      int.value = "";
      fetchChat();
    }

    function handleKeyPress(e) { if(e.key === 'Enter') sendMessage(); }

    setInterval(fetchLiveData, 3000);
    setInterval(fetchChat, 2000);
    setInterval(checkMarketSchedule, 1000);
    
    checkMarketSchedule();
    fetchLiveData();
    fetchChat();

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById('audio-btn'); 
      if (btn) {
        if (soundEnabled) {
            btn.innerHTML = "🔊 အသံဖွင့်ထားသည်";
        } else {
            btn.innerHTML = "🔇 အသံပိတ်ထားသည်";
        }
      }
    }
  </script>
</body>
</html>
